<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MargyC — Claude с большим количеством функций</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF8F2; --bg2:#DFF1E7; --ink:#12301F; --muted:#4A6656;
  --mint:#8ED1B4; --mint-d:#2F8D68; --mint-dd:#23694E; --card:#FFFFFF; --line:#C6E3D2; --btn-ink:#0D2818;
  --shadow:0 30px 60px -30px rgba(20,80,50,.35);
  --font:"Anthropic Sans","Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1913; --bg2:#122219; --ink:#E6F5EC; --muted:#9CB9A9; --mint-d:#8ED1B4; --mint-dd:#A9E2C8;
    --card:#17291F; --line:#25423400; --line:#254334; --shadow:0 30px 60px -30px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1913; --bg2:#122219; --ink:#E6F5EC; --muted:#9CB9A9; --mint-d:#8ED1B4; --mint-dd:#A9E2C8;
  --card:#17291F; --line:#254334; --shadow:0 30px 60px -30px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
img,svg{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint-dd);outline-offset:3px;border-radius:12px}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bar{position:fixed;left:0;top:0;height:4px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--mint),var(--mint-d));z-index:60}

/* NAV */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.stuck{border-color:var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:-.02em;text-decoration:none}
.brand img{width:38px;height:38px;border-radius:11px}
.nav-r{display:flex;align-items:center;gap:4px}
.nav-r a.l{text-decoration:none;font-weight:600;font-size:16px;padding:8px 14px;border-radius:999px;color:var(--muted);transition:background .2s,color .2s}
.nav-r a.l:hover{background:var(--bg2);color:var(--ink)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.icon-btn:hover{transform:rotate(25deg) scale(1.06)}
.icon-btn svg{width:20px;height:20px}
.sun{display:none}
:root[data-theme="dark"] .sun{display:block}
:root[data-theme="dark"] .moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sun{display:block}:root:not([data-theme="light"]) .moon{display:none}}
@media(max-width:760px){.nav-r a.l.opt{display:none}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:17px;text-decoration:none;padding:15px 28px;border-radius:999px;border:2px solid transparent;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn svg{width:20px;height:20px;flex:none}
.btn-p{background:var(--mint);color:var(--btn-ink);box-shadow:0 10px 28px -10px var(--mint-d)}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 18px 32px -12px var(--mint-d)}
.btn-s{border-color:var(--mint-d);background:transparent}
.btn-s:hover{background:var(--bg2);transform:translateY(-3px)}

/* HERO */
.hero{position:relative;padding:48px 0 90px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(64px,11.5vw,150px);line-height:.88;letter-spacing:-.055em;font-weight:900;margin:0 0 26px}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(60px) rotate(6deg);animation:letter .9s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.lead{font-size:clamp(21px,2.5vw,28px);line-height:1.35;max-width:22ch;color:var(--muted);margin:0 0 36px;font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.hero-art{position:relative;display:flex;justify-content:center;align-items:center}
.blob{position:absolute;top:2%;left:50%;width:92%;aspect-ratio:1;translate:-50% 0;background:var(--mint);opacity:.5;border-radius:46% 54% 42% 58%/52% 44% 56% 48%;animation:morph 14s ease-in-out infinite;z-index:0}
@keyframes morph{50%{border-radius:58% 42% 56% 44%/42% 58% 42% 58%;rotate:10deg}}
.float-icon{position:absolute;left:-1%;top:4%;width:clamp(84px,12vw,128px);border-radius:28%;z-index:3;box-shadow:0 24px 50px -16px var(--mint-dd);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-5deg)}}
.tilt{perspective:1100px;z-index:2}

/* SMARTPHONE */
.device{position:relative;width:min(76vw,300px);padding:10px;border-radius:50px;
  background:linear-gradient(145deg,#3a423e,#0d1210 40%,#1b221e 70%,#3a423e);
  box-shadow:var(--shadow),inset 0 0 0 1.5px rgba(255,255,255,.14),inset 0 0 0 4px #0a0e0c}
.device::before{content:"";position:absolute;right:-3px;top:23%;width:4px;height:70px;border-radius:0 3px 3px 0;background:#2a312d}
.device::after{content:"";position:absolute;left:-3px;top:17%;width:4px;height:48px;border-radius:3px 0 0 3px;background:#2a312d;box-shadow:0 66px 0 #2a312d}
.screen{position:relative;aspect-ratio:1080/2460;border-radius:40px;overflow:hidden;background:#000;isolation:isolate}
.screen img{width:100%;height:100%;object-fit:cover}
.screen .cam{position:absolute;left:50%;top:2.1%;width:5.6%;aspect-ratio:1;translate:-50% 0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3550,#05070a 60%);box-shadow:0 0 0 2px #000;z-index:3}
.screen .gloss{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.10),rgba(255,255,255,0) 32%);pointer-events:none;z-index:2}
.hero .device{animation:hover 6s ease-in-out infinite;z-index:2}
@keyframes hover{50%{transform:translateY(-10px) rotate(.8deg)}}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:36px}.lead{max-width:none}.hero-art{margin-top:4px}}

/* SHOWCASE */
.sec-h{padding:90px 0 20px;text-align:center}
.sec-h h2{font-size:clamp(36px,6vw,76px);line-height:.98;letter-spacing:-.045em;font-weight:900;margin:0 auto 16px;max-width:15ch}
.sec-h p{color:var(--muted);font-size:20px;margin:0 auto;max-width:36ch;font-weight:500}
.show{background:var(--bg2);padding:10px 0 40px;margin-top:70px}
.show-g{display:grid;grid-template-columns:1fr 1fr;gap:70px}
.step{min-height:86vh;display:flex;align-items:center;opacity:.35;transition:opacity .5s}
.step.on{opacity:1}
.step h3{font-size:clamp(34px,4.6vw,58px);line-height:1;letter-spacing:-.04em;font-weight:900;margin:0 0 18px}
.step p{margin:0 0 12px;color:var(--muted);font-size:20px;max-width:40ch;font-weight:500}
.step .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tag{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px}
.idx{display:flex;gap:6px;margin-bottom:22px}
.idx b{height:6px;width:22px;border-radius:3px;background:var(--line);transition:width .4s,background .4s}
.idx b.a{width:46px;background:var(--mint-d)}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);height:calc(100vh - 110px);display:flex;align-items:center;justify-content:center}
.sticky .shape{position:absolute;width:min(100%,520px);aspect-ratio:1;background:var(--mint);opacity:.45;border-radius:38% 62% 55% 45%/48% 40% 60% 52%;animation:morph 16s ease-in-out infinite}
.sticky .device{width:clamp(200px,calc((100vh - 230px)*.43),310px)}
.sticky .screen img{position:absolute;inset:0;opacity:0;transform:scale(.97) translateY(16px);transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.3,1)}
.sticky .screen img.on{opacity:1;transform:none}
.step-phone{display:none}
@media(max-width:900px){
  .show-g{grid-template-columns:1fr;gap:0}
  .sticky{display:none}
  .step{min-height:0;opacity:1;flex-direction:column;align-items:flex-start;gap:34px;padding:56px 0}
  .step-phone{display:block;align-self:center;width:min(70vw,270px)}
  .step-phone .device{width:100%}
}

/* DOWNLOAD */
.dl{padding:60px 0 100px}
.dl-card{position:relative;overflow:hidden;border-radius:44px;background:var(--mint);color:var(--btn-ink);padding:clamp(36px,7vw,90px) clamp(24px,6vw,80px);display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.dl-card h2{font-size:clamp(40px,7vw,92px);line-height:.92;letter-spacing:-.05em;font-weight:900;margin:0 0 20px}
.dl-card p{font-size:21px;margin:0 0 30px;font-weight:600;max-width:26ch;opacity:.85}
.dl-card .btn-p{background:var(--btn-ink);color:#EAF8F0;box-shadow:none}
.dl-card .btn-s{border-color:var(--btn-ink);color:var(--btn-ink)}
.dl-card .btn-s:hover{background:rgba(255,255,255,.4)}
.dl-art{display:grid;place-items:center}
.dl-art img{width:min(100%,260px);border-radius:28%;box-shadow:0 30px 60px -20px rgba(10,60,40,.5);animation:bob 6s ease-in-out infinite}
@media(max-width:800px){.dl-card{grid-template-columns:1fr;border-radius:34px}.dl-art{order:-1;justify-items:start}.dl-art img{width:110px}}
footer{padding:0 0 44px;text-align:center;color:var(--muted);font-size:15px;font-weight:500}
footer a{margin:0 8px}

/* reveal */
.js .rv{opacity:0;transform:translateY(40px) scale(.98);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.9,.3,1)}
.js .rv.in{opacity:1;transform:none}
.js .d1{transition-delay:.08s}.js .d2{transition-delay:.16s}.js .d3{transition-delay:.24s}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero h1 span{opacity:1;transform:none}
  .js .rv{opacity:1;transform:none}
  .step{opacity:1}
  html{scroll-behavior:auto}
}
</style>
</head>
